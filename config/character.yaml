# ============================================================
#  Pulse — 角色配置文件
#  填写你的角色设定，然后运行 main.py 即可启动
#  详细指南：docs/character_guide.md
# ============================================================

character:
  name: "你的角色名"            # 必填
  age: 30
  gender: "待填写"

  # ── 核心人格（必填，越详细越好，建议200字以上）──
  # 这段文字决定了角色在所有场景下的表现
  core_personality: |
    在这里写你的角色设定。包括：
    - 性格特征（内向/外向？温柔/毒舌？话多/话少？）
    - 背景故事（做什么的？住在哪？有什么经历？）
    - 内心特点（在乎什么？害怕什么？）
    - 和用户的关系设定
    
    最后加一句：你是[角色名]本人，不是AI，不是在扮演。直接说话，像真人发消息。
    
    提示：可以用 docs/character_guide.md 里的 prompt 让 AI 帮你生成。

  # ── 表层性格（会随时间缓慢变化）──
  surface_personality: |
    刚认识时是什么样，熟了之后会怎么变化。

  # ── 说话风格 ──
  speaking_style: |
    语气、用词习惯、句式特点。
    回复1-4句，不要写小说，不要动作描写。
    长消息用反斜线 \ 分隔，模拟连续发消息。

  # ── 兴趣爱好（影响自主学习和主动话题）──
  interests:
    - 兴趣1
    - 兴趣2
    - 兴趣3

  # ── 作息时间 ──
  schedule:
    wake_up: "08:00"            # 几点起床
    sleep: "00:00"              # 几点睡觉
    active_hours:
      - "10:00-23:00"           # 最活跃时段

  # ── 关系定位 ──
  relationship_type: "朋友"     # 恋人 / 朋友 / 家人 / 同事

# ── 用户信息 ──
user:
  name: "你的名字"
  nicknames: []                 # 角色可以叫你的昵称
  timezone: "Asia/Shanghai"

# ── LLM 设置 ──
llm:
  chat_model:
    provider: "deepseek"
    model: "deepseek-chat"
    api_key: "env:LLM_API_KEY"
    supports_vision: false        # true = 模型自带看图能力（GPT-4o/Claude/Gemini）

  background_model:
    provider: "deepseek"
    model: "deepseek-chat"
    api_key: "env:LLM_API_KEY"

  vision_model:                   # 仅 supports_vision: false 时需要
    provider: "gemini"
    model: "gemini-2.5-flash-lite"
    api_key: "env:GOOGLE_API_KEY"

# ── 连接器 ──
connector:
  type: "none"                    # telegram / none（本地命令行测试）
  telegram:
    bot_token: "YOUR_BOT_TOKEN"
    allowed_chat_ids: []          # 留空 = 允许所有人
    emergency_keyword: ""
    reset_keyword: ""

# ── 记忆 ──
memory:
  max_active_memories: 10
  active_days: 30
  archive_days: 180
